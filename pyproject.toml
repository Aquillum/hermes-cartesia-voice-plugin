[project]
name = "hermes-cartesia-voice-plugin"
version = "0.2.1"
description = "Native Cartesia whole-file TTS provider for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Aquillum"}]
dependencies = []
keywords = ["hermes", "cartesia", "tts"]

# Hermes directory discovery is the supported installation path.
# No pip entry point: avoids duplicate registration after directory install.
# Virtual metadata lets Hermes assign a unique workspace name per profile.
[tool.uv]
package = false
